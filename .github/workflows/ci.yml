name: piton-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.3"
          cache: pnpm
      - name: Activate package-manager version declared by the repository
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - name: Install exact browser dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript checks and unit/component tests
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Install pinned Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser-local golden path
        run: pnpm test:e2e

  verify:
    # Ubuntu 24.04's runner-wide AppArmor policy rejects unprivileged user
    # namespaces. Keep that protection intact; use the pinned runner image whose
    # supported bubblewrap configuration can create the required isolated child.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"
      - name: Install pinned uv
        run: python3 -m pip install uv==0.11.6
      - name: Install precision-worker sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Preflight precision-worker namespace policy
        run: uv run --frozen python -m piton.precision_worker_launch --preflight-sandbox
      - name: Sync exact locked dependencies
        run: uv sync --frozen --all-extras
      - name: Unit and contract tests
        run: uv run --frozen python -m pytest -q
      - name: Repository proof
        run: uv run --frozen python scripts/verify_repo.py
      - name: Exact-geometry doctor
        run: uv run --frozen python scripts/doctor.py
      - name: Build wheel
        run: uv run --frozen python -m build --wheel
      - name: Install wheel and smoke test in a clean environment
        run: |
          uv venv --python 3.12.11 /tmp/piton-wheel-venv
          uv pip install --python /tmp/piton-wheel-venv/bin/python dist/*.whl
          /tmp/piton-wheel-venv/bin/python scripts/install_verify.py
