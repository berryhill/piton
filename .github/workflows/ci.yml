name: piton-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"
      - name: Install pinned uv
        run: python3 -m pip install uv==0.11.6
      - name: Sync exact locked dependencies
        run: uv sync --frozen --all-extras
      - name: Unit and contract tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Repository proof
        run: uv run --frozen python scripts/verify_repo.py
      - name: Exact-geometry doctor
        run: uv run --frozen python scripts/doctor.py
      - name: Build wheel
        run: uv run --frozen python -m build --wheel
      - name: Install wheel and smoke test in a clean environment
        run: |
          uv venv --python 3.12.11 /tmp/piton-wheel-venv
          uv pip install --python /tmp/piton-wheel-venv/bin/python --no-deps dist/*.whl
          /tmp/piton-wheel-venv/bin/python scripts/install_verify.py
