[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piton-cad"
version = "0.1.0"
description = "Local-first, source-native mechanical CAD with governed revisions and human review."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "Nick Mercer"}]
dependencies = []

[project.optional-dependencies]
verification = ["jsonschema==4.26.0"]
build = ["build==1.3.0"]
cad = ["build123d==0.11.1", "cadquery-ocp==7.9.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
