[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piton-cad"
version = "0.1.0"
description = "Local-first, source-native mechanical CAD with governed revisions and human review."
requires-python = "==3.12.11"
license = "LicenseRef-Proprietary"
authors = [{name = "Nick Mercer"}]
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
verification = ["pytest==8.4.2"]
build = ["build==1.3.0"]
cad = ["build123d==0.11.1", "cadquery-ocp-novtk==7.9.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"piton" = ["schemas/*.json", "viewer_assets/*.html", "viewer_assets/*.js", "viewer_assets/*.css", "viewer_assets/*.txt"]
"piton.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
